            <p>Hàm có tác dụng bọc khối lệnh lại để tái sử dụng</p>
            <p>Ví dụ 1:</p>
            <div class="codebox">
                <p><code><span class="orangered">def <span class="lightpurple">function<span class="yellow">()<span class="white">:</span></code></p>
                <p><code><span class="hidden">----<span class="lightpurple">print<span class="yellow">(<span class="orangered">f<span class="lightblue">"zadf2008"<span class="yellow">)</span></code></p>
            </div>
            <p>Ví dụ 2:</p>
            <div class="codebox">
                <p><code><span class="orangered">def <span class="lightpurple">function<span class="yellow">(<span class="orange">a</span>)<span class="white">:</span></code></p>
                <p><code><span class="hidden">----<span class="lightpurple">print<span class="yellow">(<span class="orange">a<span class="yellow">)</span></code></p>

                <p><code><span class="lightpurple">function<span class="yellow">(<span class="lightblue">"zadf2008"<span class="yellow">)</span></code></p>
            </div>
            <p>Ví dụ 3:</p>
            <div class="codebox">
                <p><code><span class="orangered">def <span class="lightpurple">function<span class="yellow">(<span class="orange">a<span class="white">, <span class="orange">b<span class="yellow">)<span class="white">:</span></code></p>
