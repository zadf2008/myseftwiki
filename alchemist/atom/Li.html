<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../decor.css">
    <link rel="icon" href="../../images-removebg-preview.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="drawneutron.js"></script>
    <title>Li</title>
</head>

<body>
    <header> <a href="../pagealchemist.html">Lithium</a> </header>
    <div style="display: flex;">
        <nav>
            <p><a href="H.html">H</a></p>
            <p><a href="He.html">He</a></p>
            <p><a>Li</a></p>
        </nav>
        <main>
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <div style="width: max-content;">
                    <p>Chu kì 2</p>
                    <p>Nhóm 1A</p>
                    <p>Nguyên tử khối: 6.941</p>
                    <p>Cấu hình electron: 1s\(^2\)2s\(^1\)</p>
                    <p>Độ âm điện: 0.98</p>
                    <p>Trạng thái tự nhiên: Rắn</p>
                </div>
                <div style="width: 20%;justify-self: right;">
                    <table>
                        <thead>
                            <tr>
                                <th>Lithium</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <canvas id="atom" style="width: 100%; height: auto;"></canvas>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

<script>
    const canvas = document.getElementById('atom');
    const ctx = canvas.getContext('2d');

    createAtom(3, 4, 3, "atom");

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Xóa màn hình cũ

        // 1. Cập nhật và Vẽ chùm hạt nhân (Proton & Neutron) trước
        nucleusList.forEach(particle => {
            particle.update();
            particle.draw();
        });

        // 2. Cập nhật và Vẽ các Electron bay xung quanh vỏ
        electronList.forEach(electron => {
            electron.update();
            electron.draw();
        });

        requestAnimationFrame(animate); // Lặp lại vòng quay vô hạn
    }

    // Bật công tắc vận hành hệ thống
    animate();
</script>

</html>
